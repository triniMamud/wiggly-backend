#Database
spring.datasource.url=jdbc:mysql://localhost:3306/wiggly?serverTimezone=UTC
spring.datasource.username=wiggly_user
spring.datasource.password=wiggly_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ? update crea las tablas automáticamente
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8080

# Logs
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# CORS ? permite el emulador Android
app.cors.allowedOrigins=http://localhost:3000,http://10.0.2.2:3000
